name: Mobile App Build & Submit

on:
  push:
    tags:
      - 'pop@*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - all
          - ios
          - android
        default: all
      profile:
        description: 'EAS build profile'
        required: true
        type: choice
        options:
          - production
          - preview
        default: production
      skip_submit:
        description: 'Build only, skip store submission'
        required: false
        type: boolean
        default: false

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' && fromJSON('["ios", "android"]') || fromJSON(format('["{0}"]', github.event.inputs.platform))) || fromJSON('["ios", "android"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: cd frontend && eas build --platform ${{ matrix.platform }} --profile ${{ steps.profile.outputs.value }} --non-interactive

      - name: Submit to store
        if: steps.profile.outputs.value == 'production' && github.event.inputs.skip_submit != 'true'
        run: cd frontend && eas submit --platform ${{ matrix.platform }} --profile production --non-interactive
