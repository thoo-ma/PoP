name: Edge Functions

on:
  push:
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "shared/**"
      - ".github/workflows/edge-functions.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - "shared/**"
      - ".github/workflows/edge-functions.yml"

concurrency:
  group: edge-functions-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  deno-check:
    name: deno check
    runs-on: ubuntu-latest
    env:
      DENO_DIR: ~/.deno

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/cache@v4
        with:
          path: ~/.deno
          key: deno-${{ hashFiles('supabase/functions/import_map.json') }}
          restore-keys: deno-

      - name: Lint edge functions
        working-directory: supabase/functions
        run: deno lint

      - name: Type-check edge functions
        working-directory: supabase/functions
        run: deno check --config deno.json */index.ts

  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    needs: deno-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: v1.187.6

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
