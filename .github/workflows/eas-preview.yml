name: Mobile Preview Build

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options: [all, ios, android]
        default: all

concurrency:
  group: eas-preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'preview-build' &&
       !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' && fromJSON('["ios", "android"]') || fromJSON(format('["{0}"]', github.event.inputs.platform))) || fromJSON('["ios", "android"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write ASC API key
        if: matrix.platform == 'ios'
        run: |
          printf '%b\n' "$ASC_API_KEY" > "$RUNNER_TEMP/asc-api-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-api-key.p8"
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}

      - name: Build preview (iOS)
        if: matrix.platform == 'ios'
        run: cd frontend && eas build --platform ios --profile preview --non-interactive
        env:
          EXPO_ASC_API_KEY_PATH: ${{ format('{0}/asc-api-key.p8', runner.temp) }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}

      - name: Build preview (Android)
        if: matrix.platform == 'android'
        run: cd frontend && eas build --platform android --profile preview --non-interactive

      - name: Clean up ASC API key
        if: matrix.platform == 'ios' && always()
        run: rm -f "$RUNNER_TEMP/asc-api-key.p8"
