name: Mobile Production Build & Submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - all
          - ios
          - android
        default: all
      skip_submit:
        description: 'Build only, skip store submission'
        required: false
        type: boolean
        default: false

concurrency:
  group: eas-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ${{ github.event.inputs.platform == 'all' && fromJSON('["ios", "android"]') || fromJSON(format('["{0}"]', github.event.inputs.platform)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: cd frontend && eas build --platform ${{ matrix.platform }} --profile production --non-interactive

      - name: Submit to store
        if: github.event.inputs.skip_submit != 'true'
        run: cd frontend && eas submit --platform ${{ matrix.platform }} --profile production --non-interactive
