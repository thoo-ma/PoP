name: Deno Check (Edge Functions)

on:
  push:
    paths:
      - "supabase/functions/**"
      - "shared/**"
      - ".github/workflows/deno-check.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - "shared/**"
      - ".github/workflows/deno-check.yml"

jobs:
  deno-check:
    name: deno check
    runs-on: ubuntu-latest
    env:
      DENO_DIR: ~/.deno

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/cache@v4
        with:
          path: ~/.deno
          key: deno-${{ hashFiles('supabase/functions/import_map.json') }}
          restore-keys: deno-

      - name: Lint edge functions
        working-directory: supabase/functions
        run: deno lint

      - name: Type-check edge functions
        working-directory: supabase/functions
        run: deno check --config deno.json */index.ts
